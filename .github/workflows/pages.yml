# Publica la versió Microsoft 365 de l'app (dist/m365) a GitHub Pages cada cop que canvia la branca main.
# Cal activar-ho un cop: Settings › Pages › Build and deployment › Source: GitHub Actions.
name: Publica l'app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publica:
    runs-on: ubuntu-24.04 # fixada: el 19 d'octubre de 2026 «ubuntu-latest» passa a l'Ubuntu 26
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node app/build.mjs
      - run: node --test app/test/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/m365
      - id: deployment
        uses: actions/deploy-pages@v4
